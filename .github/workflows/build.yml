# CI for the browser-accessible VS Code image in this repository.
#
# Flow: build (ubuntu-24.04 runner, buildx, linux/amd64) -> push to GHCR on
# pushes to main / v* tags / manual dispatch; mark the built image as loaded
# locally on pull_request runs -> run scripts/ci-smoke.sh against the image ->
# write a job summary. A red smoke test fails the job in every case.
#
# Image runtime contract assumed from the Dockerfile/entrypoint (owned by the
# container workstream; keep both sides in sync):
#   - serves VS Code web on container port 8000
#   - runs as non-root user "coder" (uid 1000), entrypoint
#     /usr/local/bin/entrypoint.sh, no connection token by default
#   - VS Code web server cache is pre-warmed at build time, so the HTTP 200
#     usually appears well under 60s; the smoke test allows up to 180s.
name: build-vscode-web-image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/frti64/web-vscode

jobs:
  build:
    name: Build, push and smoke-test image
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in only when the image will actually be pushed. PRs (including
      # forks) never get push credentials, they build + load the image locally.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      # Push on non-PR runs (main / tags / dispatch); on PR runs push is off
      # and load:true puts the image in the local Docker store so the smoke
      # test can run against it without any registry credentials.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Pulls the just-pushed image on push runs, uses the locally loaded image
      # on PR runs; fails unless the container serves the VS Code workbench.
      - name: Smoke test image
        id: smoke
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          PULL_IMAGE: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci-smoke.sh
          ./scripts/ci-smoke.sh

      - name: Job summary
        if: always()
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          IMAGE_NAME="${IMAGE_NAME:-unknown/image}"
          IMAGE_TAGS="${IMAGE_TAGS:-}"
          IMAGE_DIGEST="${IMAGE_DIGEST:-}"
          SMOKE_RESULT="${SMOKE_RESULT:-unknown}"
          GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          EVENT_NAME="${GITHUB_EVENT_NAME:-unknown}"
          REF_NAME="${GITHUB_REF_NAME:-unknown}"
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"
          REPOSITORY="${GITHUB_REPOSITORY:-unknown/unknown}"
          RUN_ID="${GITHUB_RUN_ID:-0}"

          tags_flat="$(printf '%s\n' "$IMAGE_TAGS" | sed '/^[[:space:]]*$/d' | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          if [ -z "$tags_flat" ]; then
            tags_flat="(not resolved)"
          fi
          digest="$IMAGE_DIGEST"
          if [ -z "$digest" ]; then
            digest="not pushed (pull_request build)"
          fi

          {
            echo "## web-vscode image"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| image | \`${IMAGE_NAME}\` |"
            echo "| tags | ${tags_flat} |"
            echo "| digest | ${digest} |"
            echo "| trigger | ${EVENT_NAME} (${REF_NAME}) |"
            echo "| smoke test | ${SMOKE_RESULT} |"
            echo "| run | [${RUN_ID}](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}) |"
          } >> "$GITHUB_STEP_SUMMARY"
