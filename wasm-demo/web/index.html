<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VS Code running in WebAssembly (container2wasm)</title>
<link rel="stylesheet" href="/vendor/xterm.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1220; color: #e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  #hud { padding: 14px 18px; background: linear-gradient(180deg, #111a2e, #0d1526); border-bottom: 1px solid #1f2a44; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title { font-weight: 650; font-size: 15px; letter-spacing: .2px; }
  .badge { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px; background: #1d4ed8aa; color: #dbeafe; border: 1px solid #3b82f6; }
  #status { font-size: 13px; color: #93c5fd; }
  #elapsed { font-variant-numeric: tabular-nums; color: #64748b; font-size: 12px; }
  #bar { width: 100%; height: 4px; background: #1e293b; border-radius: 999px; overflow: hidden; }
  #barfill { height: 100%; width: 4%; background: linear-gradient(90deg, #2563eb, #22d3ee); transition: width .6s ease; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid transparent; }
  .btn.primary { background: #16a34a; color: #f0fdf4; box-shadow: 0 0 0 1px #15803d44, 0 6px 18px -8px #16a34a; }
  .btn.primary:hover { background: #15803d; }
  .btn.ghost { background: transparent; color: #cbd5e1; border-color: #334155; }
  .btn.ghost:hover { background: #1e293b; }
  .hidden { display: none !important; }
  #terminalWrap { flex: 1; min-height: 0; padding: 10px 12px; overflow: hidden; background: #0a0f1a; }
  #vscodeWrap { flex: 1; min-height: 0; background: #1e1e1e; }
  #vscodeFrame { width: 100%; height: 100%; border: 0; display: block; }
  #terminal { width: 100%; height: 100%; }
  .xterm { height: 100%; }
  #toast { position: fixed; right: 16px; bottom: 16px; background: #7f1d1d; color: #fee2e2; border: 1px solid #b91c1c; padding: 10px 14px; border-radius: 8px; font-size: 12px; max-width: 46vw; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="hud">
  <div class="row">
    <span class="title">VS Code</span>
    <span class="badge">running in WebAssembly · container2wasm</span>
    <span style="flex:1"></span>
    <span id="elapsed">0.0s</span>
  </div>
  <div class="row">
    <span id="status">初始化…</span>
    <span style="flex:1"></span>
    <button id="toggleLog" class="btn ghost" type="button">显示/隐藏启动日志</button>
    <a id="openVscode" class="btn primary hidden" href="#" target="_blank" rel="noopener">打开 VS Code ↗</a>
  </div>
  <div id="bar"><div id="barfill"></div></div>
  <div id="hint" style="font-size:12px;color:#64748b">
    首次打开需要在浏览器里引导一个 x86_64 Linux 容器（约 8-10 分钟，取决于机器性能）；就绪后 VS Code 会被内嵌到本页。
    页面刷新会重启容器。镜像由 GitHub Actions 构建并转换为 WebAssembly。
  </div>
</div>
<div id="terminalWrap"><div id="terminal"></div></div>
<div id="vscodeWrap" class="hidden"><iframe id="vscodeFrame" src="about:blank" title="VS Code"></iframe></div>
<div id="toast" class="hidden"></div>

<!-- generated by `c2w --to-js` (file-packager preload) -->
<script src="/load.js"></script>
<!-- xterm UMD build: sets window.Terminal -->
<script src="/vendor/xterm.js"></script>
<script>
  // State observed by automated tests and by the UI.
  window.__wasmApp = {
    state: 'loading',
    guestOutput: '',
    rawOutput: '',
    readyUrl: null,
    openUrl: null,
    errors: [],
    startedAt: Date.now(),
  };
</script>
<script type="module">
import { openpty } from '/vendor/xterm-pty.mjs';
import '/arg-module.js';
import initEmscriptenModule from '/out.js';

const app = window.__wasmApp;
const qs = new URLSearchParams(location.search);
const netParam = qs.get('net') || 'delegate=ws://127.0.0.1:8888';
const hostPort = qs.get('port') || '18080';
const mac = qs.get('mac') || '02:00:00:00:00:01';
const openUrl = `${location.protocol}//${location.hostname}:${hostPort}/`;
app.openUrl = openUrl;

const statusEl = document.getElementById('status');
const elapsedEl = document.getElementById('elapsed');
const barfill = document.getElementById('barfill');
const openBtn = document.getElementById('openVscode');
const toggleBtn = document.getElementById('toggleLog');
const terminalWrap = document.getElementById('terminalWrap');
const vscodeWrap = document.getElementById('vscodeWrap');
const vscodeFrame = document.getElementById('vscodeFrame');
let showingLog = true;
const toast = document.getElementById('toast');

function setStatus(text, pct) {
  app.state = text;
  statusEl.textContent = text;
  if (pct != null) barfill.style.width = pct + '%';
}
function fail(msg) {
  app.errors.push(String(msg));
  console.error(msg);
  setStatus('启动失败: ' + String(msg), 100);
  toast.textContent = '启动失败:\n' + String(msg);
  toast.classList.remove('hidden');
}
function markReady(how) {
  if (app.readyUrl) return;
  app.readyUrl = openUrl;
  app.state = 'ready';
  setStatus('VS Code 已就绪（' + how + '）', 100);
  openBtn.href = openUrl;
  openBtn.classList.remove('hidden');
  // Embed the workbench through the same-origin reverse proxy (/vs/).
  // If the embedded workbench cannot load (e.g. proxy disabled), the user can
  // still open the directly forwarded port in a new tab.
  const hint = document.getElementById('hint');
  if (hint) hint.textContent = 'VS Code 已启动并内嵌在本页；如果下方一片空白，请点击右上角「打开 VS Code」在新标签页访问。页面刷新会重启容器。';
  vscodeFrame.src = '/vs/';
  vscodeWrap.classList.remove('hidden');
  terminalWrap.classList.add('hidden');
  showingLog = false;
  toggleBtn.textContent = '显示启动日志';
}

toggleBtn.addEventListener('click', () => {
  // Toggle between the boot log and the embedded VS Code workbench.
  if (!app.readyUrl) {
    terminalWrap.classList.toggle('hidden');
    return;
  }
  showingLog = !showingLog;
  terminalWrap.classList.toggle('hidden', !showingLog);
  vscodeWrap.classList.toggle('hidden', showingLog);
  toggleBtn.textContent = showingLog ? '显示 VS Code' : '显示启动日志';
});

const xterm = new Terminal({
  fontSize: 12,
  fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
  scrollback: 8000,
  convertEol: false,
  theme: { background: '#0a0f1a', foreground: '#d1d5db', cursor: '#60a5fa' },
});
xterm.open(document.getElementById('terminal'));
const { master, slave } = openpty();
xterm.loadAddon(master);
Module.pty = slave;
Module['mainScriptUrlOrBlob'] = location.origin + '/out.js';

// Capture the guest console output so we can show boot progress.
// (a) xterm output, (b) raw pty slave writes (what c2w's own test page uses)
const origSlaveWrite = slave.write.bind(slave);
slave.write = (data) => {
  try {
    app.rawOutput += new TextDecoder().decode(data instanceof Uint8Array ? data : new Uint8Array(data));
  } catch (e) { /* ignore */ }
  scanBootProgress();
  return origSlaveWrite(data);
};
const origWrite = xterm.write.bind(xterm);
xterm.write = (data, cb) => {
  try { app.guestOutput += data; } catch (e) { /* ignore */ }
  scanBootProgress();
  return origWrite(data, cb);
};
function scanBootProgress() {
  if (app.readyUrl) return; // ready status is final
  const out = app.rawOutput;
  if (/Tini|tini|entrypoint|code serve-web/i.test(out)) setStatus('容器启动中：正在启动 VS Code Server…', 70);
  if (/Linux version/.test(out)) setStatus('Linux 内核已启动，正在运行容器…', 55);
  if (/Web UI available at/.test(out)) setStatus('VS Code Server 正在启动…', 80);
  if (/Server bound to/.test(out) && !app.readyUrl) {
    setStatus('VS Code Server 已启动，等待端口转发…', 95);
    setTimeout(() => markReady('serve-web 已启动'), 1500);
  }
}

// Networking: delegate mode forwards all guest packets over WebSocket to
// `c2w-net` running on the host (which also exposes guest :8000 on :18080).
let info = 't:' + Math.round(Date.now() / 1000) + '\n';
const eq = netParam.indexOf('=');
const mode = eq === -1 ? netParam : netParam.slice(0, eq);
if (mode === 'delegate') {
  const url = netParam.slice(eq + 1);
  Module['websocket'] = { url };
  info += 'n:' + mac + '\n';
} else if (mode === 'browser') {
  fail('net=browser 模式需要额外的 c2w-net-proxy.wasm，本示例只支持 delegate 模式');
} else {
  info += 'n:' + mac + '\n';
}

window.__diag = () => ({
  crossOriginIsolated: self.crossOriginIsolated,
  hasModule: typeof Module !== 'undefined',
  moduleArguments: (typeof Module !== 'undefined' && Module['arguments']) || null,
  websocketConfig: (typeof Module !== 'undefined' && Module['websocket']) || null,
  guestOutputLen: app.guestOutput.length,
  rawOutputLen: app.rawOutput.length,
  rawTail: app.rawOutput.slice(-2000),
});
// log worker / websocket lifecycle to the browser console for debugging
(function instrument() {
  const W = window.Worker;
  window.Worker = class extends W {
    constructor(...a) { super(...a); console.log('[worker] created', a[0]); }
  };
  const WS = window.WebSocket;
  window.WebSocket = class extends WS {
    constructor(...a) {
      super(...a);
      console.log('[ws] created', a[0]);
      this.addEventListener('open', () => console.log('[ws] open', a[0]));
      this.addEventListener('close', (e) => console.log('[ws] close', a[0], e.code, e.reason));
      this.addEventListener('error', () => console.log('[ws] error', a[0]));
    }
  };
})();

Module['preRun'].push((mod) => {
  try { mod.FS.mkdir('/pack'); } catch (e) {}
  mod.FS.writeFile('/pack/info', info);
});

const readableCallbacks = [];
Module.pty.onReadable(() => {
  readableCallbacks.splice(0).forEach((cb) => cb());
});
Module['preRun'].push((M) => {
  M['TTY'].stream_ops.poll = (stream, timeout, notifyCallback) => {
    if (M.pty.readable) return 1;
    if (notifyCallback != null) {
      notifyCallback.registerCleanupFunc(() => {
        const i = readableCallbacks.indexOf(notifyCallback);
        if (i !== -1) readableCallbacks.splice(i, 1);
      });
      readableCallbacks.push(notifyCallback);
    }
    return 0;
  };
});

// Timer + readiness polling: the guest answers HTTP 200 on the forwarded port
// once `code serve-web` inside the container is listening. Cross-origin fetch
// in no-cors mode is enough to detect reachability (the response is opaque).
const started = Date.now();
const timer = setInterval(() => {
  elapsedEl.textContent = ((Date.now() - started) / 1000).toFixed(1) + 's';
}, 100);
const poller = setInterval(async () => {
  if (app.readyUrl) { clearInterval(poller); return; }
  try {
    const r = await fetch('/__status', { cache: 'no-store' });
    const st = await r.json();
    if (st.ready) markReady('转发端口已可访问');
  } catch (e) { /* not ready yet */ }
}, 2000);

// Programmatic input into the guest console (used by automated smoke tests
// and by the page's own "run command" affordances).
app.type = (text) => {
  const core = xterm._core || {};
  const cs = core.coreService || core._coreService;
  if (cs && typeof cs.triggerDataEvent === 'function') {
    cs.triggerDataEvent(text, true);
    return true;
  }
  return false;
};
window.__sendInput = app.type;

setStatus('加载 Wasm 模块与容器镜像（首次加载较慢）…', 10);
initEmscriptenModule(Module)
  .then(() => {
    app.state = 'running';
    setStatus('QEMU/Wasm 已启动，正在引导容器…', 35);
  })
  .catch((e) => fail(e));
window.addEventListener('error', (ev) => fail(ev.message));
window.addEventListener('unhandledrejection', (ev) => fail(ev.reason));
</script>
</body>
</html>
